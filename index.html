<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My To-Do List</title>

    <!-- CSS File -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>My To-Do List</h1>

        <p class="subtitle">
            Organize your daily tasks
        </p>

        <!-- Input Section -->
        <div class="input-box">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter your task..."
            >

            <button onclick="addTask()">
                Add Task
            </button>

        </div>

        <!-- Task List -->
        <ul id="taskList"></ul>

    </div>

    <!-- JavaScript File -->
    <script src="script.js"></script>

</body>
</html>
